.ctl{display:flex;align-items:center;gap:10px;margin-top:12px}

input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
#tm{font-size:13px;color:var(--muted);min-width:84px;text-align:right}
.chs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.chs button{padding:8px 6px;font-size:14px}
.note{margin:16px 0 0;color:var(--muted);font-size:13px}
</style>
